name: Validate catalogue

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check committed generated data
        run: python tests/validate_generated_data.py
      - name: Rebuild and validate catalogue and CLI builder
        run: sh tools/rebuild.sh
      - name: Confirm exact browser bundle is committed
        run: git diff --exit-code -- data/catalogue-data.js
